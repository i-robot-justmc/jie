name: Build Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Build with Gradle
      run: gradle build
    
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: JustItemEditor
        path: build/libs/*.jar
